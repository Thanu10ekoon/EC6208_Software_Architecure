server:
  port: 8151

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DATABASE_URL:${DATABASE_HOSTNAME:jdbc:mysql://localhost:3306/smartfines}}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:}}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET_KEY}
    access-token-expiration-minutes: 60
  cors:
    allowed-origins:
      - http://localhost:5173
  receipts:
    storage-path: ./storage/receipts
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    currency: lkr
    success-url: ${STRIPE_SUCCESS_URL}
    cancel-url: ${STRIPE_CANCEL_URL}

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

notify:
  user-id: ${NOTIFY_USER_ID}
  api-key: ${NOTIFY_API_KEY}
  sender-id: ${NOTIFY_SENDER_ID}
  base-url: ${NOTIFY_BASE_URL}
